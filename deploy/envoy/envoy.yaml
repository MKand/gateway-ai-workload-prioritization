# Envoy front proxy for the Gemini Quota Governor.
#
# Flow: client -> ext_proc (governor, 127.0.0.1:50052) -> dynamic forward proxy
#       -> https://<region>-aiplatform.googleapis.com
#
# The governor may rewrite :path and :authority to a fallback region. The
# dynamic forward proxy resolves the (possibly rewritten) :authority and opens a
# TLS connection to that host, so a rewrite really changes where the request goes.
#
# Clients call Envoy with the Vertex AI hostname as Host and their own OAuth
# token, e.g.:
#   curl -H "Host: us-central1-aiplatform.googleapis.com" \
#        -H "Authorization: Bearer $(gcloud auth print-access-token)" \
#        http://localhost:10000/v1/projects/.../models/gemini-...:generateContent
static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                route_config:
                  virtual_hosts:
                    # Only Vertex AI regional endpoints are proxied. Anything
                    # else is rejected so Envoy is not an open proxy.
                    - name: vertex_ai
                      domains: ["*-aiplatform.googleapis.com"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: vertex_ai
                            timeout: 300s
                    - name: reject
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body: { inline_string: "only *-aiplatform.googleapis.com hosts are proxied\n" }
                http_filters:
                  # 1. Governor: decides forward / reroute / shed and mutates headers.
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: governor }
                        timeout: 0.2s
                      # Fail open: if the governor is down, traffic still flows.
                      failure_mode_allow: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: NONE
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                      mutation_rules:
                        allow_all_routing: true
                  # 2. Resolve the (possibly rewritten) :authority. Must run after ext_proc.
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config: &dns_cache
                        name: vertex_dns_cache
                        dns_lookup_family: V4_PREFERRED
                        typed_dns_resolver_config:
                          name: envoy.network.dns_resolver.getaddrinfo
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.getaddrinfo.v3.GetAddrInfoDnsResolverConfig
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: governor
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: governor
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 50052 }
    # Connects to whatever host the request's :authority names (port 443, TLS).
    - name: vertex_ai
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: *dns_cache
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          upstream_http_protocol_options:
            auto_sni: true
            auto_san_validation: true
          auto_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            alpn_protocols: ["h2", "http/1.1"]
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
