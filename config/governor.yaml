# config/governor.yaml

project_ids:
  - "my-gcp-project"

# Every region used as a cascade fallback below must be listed here, otherwise
# its quota is never polled and config loading fails.
regions:
  - "us-central1"
  - "us-east1"
  - "us-west1"
  - "europe-west1"
  - "europe-west3"
  - "europe-west4"

models:
  - "gemini-3.5-flash"

# Reconciliation timing
poll_interval: 30s
poll_timeout: 10s

# Quota safety buffers
safety_margin: 10              # 10% safety buffer (integer percentage)

# The org's Dynamic Shared Quota allowance per "location/model". Customers cannot
# query this number, so it is configured up front (ask your account team, or use
# your observed peak without 429s). Every cascade target below needs an entry.
# The values here are placeholders: never commit real allowance numbers.
allowances:
  "us-central1/gemini-3.5-flash": { max_rpm: 360, max_tpm: 4000000 }
  "us-east1/gemini-3.5-flash":    { max_rpm: 360, max_tpm: 4000000 }
  "us-west1/gemini-3.5-flash":    { max_rpm: 360, max_tpm: 4000000 }
  "europe-west1/gemini-3.5-flash": { max_rpm: 360, max_tpm: 4000000 }
  "europe-west3/gemini-3.5-flash": { max_rpm: 360, max_tpm: 4000000 }
  "europe-west4/gemini-3.5-flash": { max_rpm: 360, max_tpm: 4000000 }

# Share of each allowance only critical traffic may use (0-90). Best-effort and
# custom traffic stop at 100 - critical_reserve_percent.
critical_reserve_percent: 30

# Data plane replicas the allowance is split across when the control plane
# cannot report the live count.
dataplane_replicas: 1

# Custom fallback cascade policies (requires both target_model and region)
custom_policies:
  quality_first-us:
    cascade:
      - target_model: "gemini-3.5-flash"
        region: "us-central1"
      - target_model: "gemini-3.5-flash"
        region: "us-east1"
      - target_model: "gemini-3.5-flash"
        region: "us-west1"
  quality_first-eu:
    cascade:
      - target_model: "gemini-3.5-flash"
        region: "europe-west1"
      - target_model: "gemini-3.5-flash"
        region: "europe-west3"
      - target_model: "gemini-3.5-flash"
        region: "europe-west4"